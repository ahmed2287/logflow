# AlmasryLog على logs.almasrypharmacy.com
# السيرفر ده خلف Cloudflare (الـ SSL هناك) — بورت 80 بس زي almasrypharmacy.com.
# التفعيل:
#   sudo cp nginx.logs.almasrypharmacy.com.conf /etc/nginx/sites-available/logs.almasrypharmacy.com
#   sudo ln -s /etc/nginx/sites-available/logs.almasrypharmacy.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name logs.almasrypharmacy.com;

    # الـ docroot هو public/ عمدًا: data/ (users.json, audit.log) و src/
    # و views/ و cli/ فوق مستوى الـ docroot ومش قابلين للوصول من الويب.
    root /var/www/html/log-manager/public;
    index index.php;

    # راوتر واحد — كل الصفحات ?page=... على index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # pool الـ php8.2-fpm شغال بمستخدم magento — نفس مالك data/ فالكتابة شغالة.
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        # قراءة لوج كبير أو حذف آلاف الملفات ممكن يعدي الـ 60 ثانية الافتراضية.
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # الصفحة فيها favicon مدمج SVG — الطلب ده مجرد ضوضاء في اللوج.
    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    location ~ /\.(?!well-known).* { deny all; }

    # اللوحة ملهاش أي رفع ملفات.
    client_max_body_size 2M;

    access_log /var/log/nginx/almasrylog.access.log;
    error_log  /var/log/nginx/almasrylog.error.log;
}
